<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse all products at PureShop — electronics, clothing, home, and fitness.">
  <title>Products — PureShop</title>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>

  <site-header active="products"></site-header>

  <main>
    <div class="site-wrap">
      <div class="container">
        <div class="section-title">
          <h2>Our Products</h2>
          <p class="text-muted">Find something you love</p>
        </div>

        <div class="products-toolbar">
          <div class="filter-group" data-filters></div>
          <span class="products-count" data-products-count></span>
        </div>

        <div class="grid grid--4" data-products-grid></div>
      </div>
    </div>
  </main>

  <site-footer></site-footer>

  <script type="module" src="../assets/js/components/header.js"></script>
  <script type="module" src="../assets/js/components/footer.js"></script>
  <script type="module" src="../assets/js/pages/products.js"></script>
  <script type="module" src="../assets/js/core/layout-debug.js"></script>

</body>
</html>
