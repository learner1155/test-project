<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your shopping cart at PureShop.">
  <title>Cart — PureShop</title>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>

  <site-header active="cart"></site-header>

  <main>
    <div class="site-wrap">
      <div class="container">
        <div class="section-title">
          <h2>Shopping Cart</h2>
          <p class="text-muted">Review your items before checkout</p>
        </div>

        <div class="cart-empty" data-cart-empty style="display: none;">
          <div class="cart-empty__icon">🛒</div>
          <h3>Your cart is empty</h3>
          <p class="text-muted">Looks like you haven't added anything yet.</p>
          <a href="products.html" class="btn btn--primary" style="margin-top: var(--space-6);">
            Browse Products
          </a>
        </div>

        <div class="cart-layout">
          <div data-cart-items></div>
          <div class="cart-summary" data-cart-summary style="display: none;"></div>
        </div>
      </div>
    </div>
  </main>

  <site-footer></site-footer>

  <script type="module" src="../assets/js/components/header.js"></script>
  <script type="module" src="../assets/js/components/footer.js"></script>
  <script type="module" src="../assets/js/pages/cart.js"></script>
  <script type="module" src="../assets/js/core/layout-debug.js"></script>

</body>
</html>
